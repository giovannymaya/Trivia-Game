<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; media-src 'self'; connect-src https://opentdb.com; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="A family-friendly, timed trivia game with sound effects and high scores.">
    <meta name="theme-color" content="#0b0820">
    <title>Maya Family Trivia Game</title>
    <link rel="icon" type="image/png" href="assets/gio_favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="game-container">

        <!-- Start screen -->
        <section id="start-screen" class="screen" aria-labelledby="game-title">
            <div class="hero">
                <div class="hero-badge" aria-hidden="true">🚀</div>
                <p class="eyebrow">Family game night</p>
                <h1 id="game-title" class="title">Maya Family <span class="gradient-text">Trivia</span></h1>
                <p class="tagline">Ten questions. Thirty seconds each. Bragging rights forever.</p>
            </div>

            <form id="player-form" class="start-form">
                <div class="field">
                    <label for="player-name">Your name</label>
                    <input type="text" id="player-name" maxlength="30" autocomplete="nickname" placeholder="Who's playing?" required>
                </div>
                <div class="field">
                    <label for="category">Category</label>
                    <div class="select-wrap">
                        <select id="category">
                            <option value="">Loading categories...</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    Start game <span aria-hidden="true">→</span>
                </button>
            </form>

            <div class="start-footer">
                <ul class="chips" aria-label="Game rules">
                    <li class="chip"><span aria-hidden="true">❓</span> 10 questions</li>
                    <li class="chip"><span aria-hidden="true">⏱️</span> 30s each</li>
                    <li class="chip"><span aria-hidden="true">🔊</span> Sound on</li>
                </ul>
                <button type="button" id="view-scores" class="btn btn-ghost btn-small">
                    <span aria-hidden="true">🏆</span> High scores
                </button>
            </div>
        </section>

        <!-- Game screen -->
        <section id="game-screen" class="screen hidden" aria-label="Trivia question">
            <div class="hud">
                <div class="player-chip">
                    <span class="avatar" id="player-avatar" aria-hidden="true"></span>
                    <span id="player-display"></span>
                </div>
                <div class="hud-right">
                    <div class="score-chip" aria-live="polite">
                        <span aria-hidden="true">⭐</span> <span id="score-display">0</span>
                    </div>
                    <div class="timer" id="timer" role="timer" aria-label="Time remaining">
                        <svg viewBox="0 0 44 44" aria-hidden="true">
                            <circle class="timer-track" cx="22" cy="22" r="19"></circle>
                            <circle class="timer-ring" id="timer-ring" cx="22" cy="22" r="19"></circle>
                        </svg>
                        <span id="timer-text">30</span>
                    </div>
                </div>
            </div>

            <ol class="progress" id="progress" aria-label="Question progress"></ol>

            <div id="game-area" aria-live="polite">
                <div class="loader"><span class="spinner" aria-hidden="true"></span><p>Loading questions...</p></div>
            </div>
        </section>

        <!-- Results / high scores screen -->
        <section id="high-scores-screen" class="screen hidden" aria-labelledby="scores-title">
            <div id="result-summary" class="result-summary hidden">
                <div class="result-emoji" id="result-emoji" aria-hidden="true"></div>
                <h2 class="result-title" id="result-title"></h2>
                <p class="result-score"><span id="result-score"></span></p>
                <p class="result-subtitle" id="result-subtitle"></p>
            </div>

            <h2 id="scores-title" class="section-title"><span aria-hidden="true">🏆</span> Leaderboard</h2>
            <ol id="high-scores-list" class="leaderboard"></ol>

            <div class="button-group">
                <button type="button" id="play-again" class="btn btn-primary">Play again</button>
                <button type="button" id="clear-scores" class="btn btn-ghost btn-danger">Clear scores</button>
            </div>
        </section>
    </main>

    <div class="video-background" aria-hidden="true">
        <video autoplay muted loop playsinline preload="auto">
            <source src="assets/space_background.mp4" type="video/mp4">
        </video>
    </div>
    <div class="video-overlay" aria-hidden="true"></div>

    <!-- audio sounds -->
    <audio id="tick-sound" src="assets/tick-sound.wav" preload="auto"></audio>
    <audio id="correct-sound" src="assets/correct-sound.mp3" preload="auto"></audio>
    <audio id="wrong-sound" src="assets/wrong-sound.mp3" preload="auto"></audio>
    <audio id="timeout-sound" src="assets/timeout-sound.mp3" preload="auto"></audio>

    <script src="app.js"></script>
</body>

</html>
